<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto com moldura · XV da Clara</title>
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#1E1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--pink:#C93764;--pink-2:#E98FAA;--ink:#FFFFFF;--bg:#1E1216;
  --script:'Pinyon Script','Snell Roundhand',cursive;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Segoe UI',system-ui,sans-serif;
  color-scheme:light dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1E1216 !important;color:#fff !important;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
[hidden]{display:none !important}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid #fff;outline-offset:3px}

.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* palco 9:16 */
.stage{position:relative;width:min(100vw, calc((100dvh - 128px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));aspect-ratio:9/16;
  background:#2B1A20;overflow:hidden;border-radius:18px}
@media (max-width:520px){.stage{border-radius:0}}
.stage video,.stage .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .shot{object-fit:cover}
.stage video.backdrop{object-fit:cover;filter:blur(22px) brightness(.9);transform:scale(1.15)}
.stage.fill video#video{object-fit:cover}
.stage.fill video.backdrop{display:none}
.stage video.mirror{transform:scaleX(-1)}
.stage video.backdrop.mirror{transform:scaleX(-1) scale(1.15)}
.stage .frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease}
.flash.on{opacity:1;transition:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:9rem;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45);pointer-events:none}

/* tela inicial */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;
  background:rgba(30,18,22,.55)}
.intro h1{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,11vw,3.4rem);line-height:1.05;color:#fff}
.intro p{margin:0;max-width:30ch;font-size:1rem;line-height:1.5;color:#F6E3E9}
.intro .note{font-size:.85rem;color:#E8C7D1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:999px;border:0;
  background:var(--pink);color:#fff;font-size:1rem;font-weight:500;text-decoration:none}
.btn.light{background:#fff;color:var(--pink)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff}

/* barra de controles */
.bar{height:128px;width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.round{width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;position:relative}
.round small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap;color:#E8C7D1}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--pink);transition:transform .12s ease}
.shutter:active span{transform:scale(.9)}
.timer-on{background:var(--pink)}

/* resultado */
.result-bar{height:auto;min-height:128px;flex-direction:column;justify-content:center;gap:10px;padding:10px 18px 14px}
.result-bar .row{display:flex;gap:10px;width:100%}
.result-bar .row .btn{flex:1;padding:0 14px}
.hint{margin:0;text-align:center;font-size:.8rem;color:#E8C7D1;line-height:1.4}
.msg{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:10px 12px;font-size:.85rem;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

    <div class="flash" id="flash"></div>
    <div class="count" id="count" aria-live="assertive"></div>

    <div class="intro" id="intro">
      <h1>Sua foto no XV da Clara</h1>
      <p>Tire uma foto com a moldura da festa e compartilhe no seu story.</p>
      <button class="btn light" id="start" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>
        Abrir câmera
      </button>
      <label class="btn ghost" for="file">Escolher da galeria</label>
      <p class="note" id="introNote">O celular vai pedir permissão para usar a câmera. Toque em <b>Permitir</b>.</p>
    </div>
    <p class="msg" id="msg" hidden></p>
  </div>

  <!-- controles da câmera -->
  <div class="bar" id="camBar" hidden>
    <label class="round" for="file" aria-label="Escolher foto da galeria">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      <small>Galeria</small>
    </label>
    <button class="shutter" id="snap" type="button" aria-label="Tirar foto"><span></span></button>
    <button class="round" id="flip" type="button" aria-label="Trocar câmera">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3l-2-3H9L7 7H4v12h16z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
      <small>Trocar</small>
    </button>
    <button class="round" id="timer" type="button" aria-label="Temporizador desligado" style="position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;background:rgba(0,0,0,.35)">
      <span id="timerTxt" style="font-size:.8rem;font-weight:500">0s</span>
    </button>
    <button class="round" id="fit" type="button" aria-pressed="false" aria-label="Aproximar a imagem" style="position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;background:rgba(0,0,0,.35)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <!-- resultado -->
  <div class="bar result-bar" id="resBar" hidden>
    <div class="row">
      <button class="btn" id="share" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>
        Compartilhar
      </button>
      <button class="btn ghost" id="save" type="button">Salvar foto</button>
    </div>
    <div class="row"><button class="btn ghost" id="again" type="button" style="min-height:42px">Tirar outra</button></div>
    <p class="hint" id="shareHint">Em <b>Compartilhar</b>, escolha <b>Instagram → Stories</b>.</p>
  </div>
</div>
<input type="file" id="file" accept="image/*" class="sr-only">
<canvas id="canvas" width="1080" height="1920" hidden></canvas>

<script>
(function(){
  var W = 1080, H = 1920;
  var $ = function(id){ return document.getElementById(id); };
  var video = $('video'), backdrop = $('backdrop'), stage = $('stage'), fill = false, frame = $('frame'), shot = $('shot'), canvas = $('canvas'), ctx = canvas.getContext('2d');
  var stream = null, facing = 'user', timer = 0, lastBlob = null, lastUrl = null;

  function say(t){ var m=$('msg'); if(!t){ m.hidden=true; return; } m.textContent=t; m.hidden=false; clearTimeout(say.t); say.t=setTimeout(function(){ m.hidden=true; }, 5000); }
  function mode(m){ // 'intro' | 'cam' | 'result'
    $('intro').hidden = m !== 'intro';
    $('camBar').hidden = m !== 'cam';
    $('resBar').hidden = m !== 'result';
    video.hidden = m === 'result'; backdrop.hidden = m === 'result';
    shot.hidden = m !== 'result';
    frame.hidden = m === 'result';
  }
  function stopCam(){ if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; } }
  function startCam(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      $('introNote').innerHTML = 'Este navegador não liberou a câmera. Abra o link no <b>Safari</b> (iPhone) ou no <b>Chrome</b> (Android), ou use <b>Escolher da galeria</b>.';
      return;
    }
    stopCam();
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080} }, audio:false })
      .then(function(s){
        stream = s; video.srcObject = s; backdrop.srcObject = s;
        video.classList.toggle('mirror', facing === 'user'); backdrop.classList.toggle('mirror', facing === 'user');
        var pb = backdrop.play(); if (pb && pb.catch) pb.catch(function(){});
        var p = video.play(); if (p && p.catch) p.catch(function(){});
        mode('cam');
      })
      .catch(function(){
        mode('intro');
        $('introNote').innerHTML = 'Não foi possível abrir a câmera. Verifique se a permissão foi liberada, ou use <b>Escolher da galeria</b>.';
      });
  }
  var small = document.createElement('canvas'); small.width = 54; small.height = 96;
  var sctx = small.getContext('2d');
  function drawPhoto(src, sw, sh, mirror, cover){
    ctx.save(); ctx.clearRect(0,0,W,H);
    if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
    var sCover = Math.max(W/sw, H/sh), sFit = Math.min(W/sw, H/sh);
    if (cover || Math.abs(sCover - sFit) / sCover < 0.08){
      ctx.drawImage(src, (W-sw*sCover)/2, (H-sh*sCover)/2, sw*sCover, sh*sCover);
    } else {
      /* fundo desfocado (reduz e amplia) + foto inteira no centro, sem zoom */
      var ss = Math.max(small.width/sw, small.height/sh);
      sctx.drawImage(src, (small.width-sw*ss)/2, (small.height-sh*ss)/2, sw*ss, sh*ss);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(small, -40, -70, W+80, H+140);
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(src, (W-sw*sFit)/2, (H-sh*sFit)/2, sw*sFit, sh*sFit);
    }
    ctx.restore();
    ctx.drawImage(frame, 0, 0, W, H);
  }
  function finish(){
    canvas.toBlob(function(b){
      lastBlob = b;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(b);
      shot.src = lastUrl;
      stopCam();
      mode('result');
      var f = new File([b], 'xv-da-clara.jpg', {type:'image/jpeg'});
      var can = navigator.canShare && navigator.canShare({files:[f]});
      $('share').hidden = !can;
      $('shareHint').innerHTML = can ? 'Em <b>Compartilhar</b>, escolha <b>Instagram → Stories</b>.' : 'Toque em <b>Salvar foto</b> e depois poste pelo Instagram. No iPhone, se abrir a imagem, toque e segure nela para salvar.';
    }, 'image/jpeg', 0.92);
  }
  function capture(){
    if (!video.videoWidth) return;
    var fl = $('flash'); fl.classList.add('on'); setTimeout(function(){ fl.classList.remove('on'); }, 60);
    drawPhoto(video, video.videoWidth, video.videoHeight, facing === 'user', fill);
    finish();
  }
  function snap(){
    if (!timer) return capture();
    var n = timer, c = $('count');
    c.textContent = n;
    var iv = setInterval(function(){ n--; if (n <= 0){ clearInterval(iv); c.textContent=''; capture(); } else c.textContent = n; }, 1000);
  }

  $('start').addEventListener('click', startCam);
  $('fit').addEventListener('click', function(){
    fill = !fill; stage.classList.toggle('fill', fill);
    this.setAttribute('aria-pressed', fill ? 'true' : 'false');
    this.setAttribute('aria-label', fill ? 'Mostrar imagem inteira' : 'Aproximar a imagem');
    this.classList.toggle('timer-on', fill);
  });
  $('snap').addEventListener('click', snap);
  $('flip').addEventListener('click', function(){ facing = facing === 'user' ? 'environment' : 'user'; startCam(); });
  $('timer').addEventListener('click', function(){
    timer = timer === 0 ? 3 : timer === 3 ? 10 : 0;
    $('timerTxt').textContent = timer + 's';
    this.classList.toggle('timer-on', timer > 0);
    this.setAttribute('aria-label', timer ? 'Temporizador de ' + timer + ' segundos' : 'Temporizador desligado');
  });
  $('file').addEventListener('change', function(){
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image();
    img.onload = function(){ drawPhoto(img, img.naturalWidth, img.naturalHeight, false, true); URL.revokeObjectURL(img.src); finish(); };
    img.onerror = function(){ say('Não consegui abrir essa imagem. Tente outra foto.'); };
    img.src = URL.createObjectURL(f);
    this.value = '';
  });
  $('share').addEventListener('click', function(){
    if (!lastBlob) return;
    var f = new File([lastBlob], 'xv-da-clara.jpg', {type:'image/jpeg'});
    navigator.share({ files:[f], title:'XV da Clara' }).catch(function(e){ if (e && e.name !== 'AbortError') say('Não foi possível compartilhar. Use Salvar foto.'); });
  });
  $('save').addEventListener('click', function(){
    if (!lastUrl) return;
    var a = document.createElement('a'); a.href = lastUrl; a.download = 'xv-da-clara.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    say('Foto salva! Se não aparecer, toque e segure na imagem para salvar.');
  });
  $('again').addEventListener('click', function(){ startCam(); });
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stopCam(); else if (!$('camBar').hidden) startCam(); });

  mode('intro');
  if (/Instagram|FBAN|FBAV|WhatsApp/i.test(navigator.userAgent)){
    $('introNote').innerHTML = 'Dica: se a câmera não abrir aqui, toque nos três pontinhos e escolha <b>Abrir no navegador</b>.';
  }
})();
</script>
</body>
</html>
