.card{position:relative;overflow:hidden;background:#F5F2EF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10mm 9mm;

.card .tl{position:absolute;left:0;top:0;height:46mm}
.card .br{position:absolute;right:0;bottom:0;height:44mm}
.mono{width:13mm;height:auto;color:#C93764}
.name{margin-top:1mm;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:5.2mm;letter-spacing:.26em;margin-right:-.26em;color:#C93764;line-height:1.1}
.xv{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:7mm;color:#B82F5A;line-height:1}
.xv small{font-size:3mm;letter-spacing:.14em;margin-left:1mm;font-weight:500}
.title{margin:3.5mm 0 3mm;font-family:'Pinyon Script',cursive;font-size:8.2mm;line-height:1.05;color:#C93764}
.qr{position:relative;z-index:1;background:#fff;padding:2.6mm;border-radius:3mm;box-shadow:0 0.4mm 1.4mm rgba(120,30,60,.15)}
.qr canvas,.qr img{display:block;width:34mm !important;height:34mm !important}
.steps{position:relative;z-index:1;margin:3.2mm 0 0;padding:0;list-style:none;font-size:2.9mm;line-height:1.45;color:#5A2A36}
.steps b{color:#C93764;font-weight:500}
.foot{margin-top:2.5mm;font-size:2.4mm;letter-spacing:.2em;color:#8E2447}
@media print{
  html,body{background:#fff !important}
  .toolbar{display:none}
  .sheet{margin:0;box-shadow:none}
}

  for (var i = 0; i < 4; i++){
    var node = tpl.content.cloneNode(true);
    var box = node.querySelector('.qr');
    sheet.appendChild(node);
    if (window.QRCode){
      new QRCode(sheet.querySelectorAll('.qr')[i], { text: target, width: 512, height: 512, colorDark: '#6E1D3C', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
    } else {
      sheet.querySelectorAll('.qr')[i].textContent = 'QR indisponível';
    }
  }
})();
</script>
</body>
</html>
